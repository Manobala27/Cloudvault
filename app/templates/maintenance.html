<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault - Under Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0B1220;
            color: #E2E8F0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .maintenance-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container p-4">
        <div class="maintenance-card p-5 text-center mx-auto shadow-lg">
            <div class="text-warning mb-4" style="font-size: 4rem;">
                <i class="bi bi-tools"></i>
            </div>
            <h3 class="fw-bold mb-3">System Under Maintenance</h3>
            <p class="text-muted mb-4">CloudVault is currently undergoing scheduled upgrades. We will be back online shortly. Thank you for your patience.</p>
            <div class="pt-3 border-top border-secondary border-opacity-10">
                <a href="/login" class="btn btn-primary rounded-pill px-4">Admin Login</a>
            </div>
        </div>
    </div>
</body>
</html>
