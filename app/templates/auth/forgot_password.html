{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card mt-4 mb-5 mx-auto">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                <h2 class="text-dark mt-2">Reset Password</h2>
                <p class="text-muted">Enter your email and we'll send you a password reset link</p>
            </div>
            
            <form method="POST" action="" class="needs-loading text-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-4 form-floating">
                    <input type="email" name="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email" class="form-label">Email Address</label>
                </div>
                
                <div class="d-grid gap-2 mb-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow-sm">Send Reset Link</button>
                </div>
                
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold text-primary">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
