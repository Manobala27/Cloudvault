{% extends "base.html" %}
{% block title %}Contact Support{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="premium-card-large p-4 mt-4 mb-5">
            <div class="text-center mb-4">
                <i class="bi bi-chat-dots-fill text-primary" style="font-size: 3rem;"></i>
                <h2 class="text-high mt-2 fw-bold">Contact Support</h2>
                <p class="text-muted">Have a question or encounter an issue? Send us a message and we'll get back to you shortly.</p>
            </div>
            
            <form method="POST" action="" class="needs-loading text-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label fw-bold">Your Name</label>
                        <input type="text" name="name" class="form-control form-themed" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control form-themed" id="email" placeholder="john@example.com" value="{{ current_user.email if current_user.is_authenticated else '' }}" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="subject" class="form-label fw-bold">Subject</label>
                    <input type="text" name="subject" class="form-control form-themed" id="subject" placeholder="Support Inquiry / Question" required>
                </div>
                
                <div class="mb-4">
                    <label for="message" class="form-label fw-bold">Message</label>
                    <textarea name="message" class="form-control form-themed" id="message" rows="5" placeholder="Please describe your query in detail..." required></textarea>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary rounded-pill py-2 shadow-sm">Submit Request</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
