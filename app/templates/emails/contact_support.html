<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket Submitted</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f8fafc; padding: 40px 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        .header { background-color: #e11d48; padding: 30px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .content { padding: 40px 30px; line-height: 1.6; }
        .content h2 { font-size: 20px; font-weight: 600; color: #0f172a; margin-top: 0; }
        .info-table { width: 100%; margin: 25px 0; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
        .info-table td { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; background-color: #f8fafc; }
        .info-table td.label { font-weight: 600; color: #475569; width: 130px; }
        .msg-box { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px 20px; font-style: italic; white-space: pre-wrap; margin-top: 15px; }
        .footer { background-color: #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <table class="wrapper" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td>
                <div class="container">
                    <div class="header">
                        <h1>☁️ CloudVault</h1>
                    </div>
                    <div class="content">
                        <h2>New Support Request</h2>
                        <p>A new support request has been submitted by a user on the Contact Support page.</p>
                        
                        <table class="info-table">
                            <tr>
                                <td class="label">Name:</td>
                                <td>{{ name }}</td>
                            </tr>
                            <tr>
                                <td class="label">Email:</td>
                                <td>{{ email }}</td>
                            </tr>
                            <tr>
                                <td class="label">Subject:</td>
                                <td>{{ subject }}</td>
                            </tr>
                        </table>
                        
                        <p><strong>Message:</strong></p>
                        <div class="msg-box">{{ message }}</div>
                    </div>
                    <div class="footer">
                        <p>&copy; 2026 CloudVault. All rights reserved.</p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
